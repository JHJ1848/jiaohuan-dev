      }
    ];

    let currentSelectedId = memoryData[0].id;

    function renderTree(filterText = '') {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';
      const filter = filterText.toLowerCase().trim();

      const categories = {};
      memoryData.forEach(item => {
        if (filter && !item.title.toLowerCase().includes(filter) && !item.desc.toLowerCase().includes(filter) && !item.content.toLowerCase().includes(filter)) {
          return;
        }
        if (!categories[item.category]) categories[item.category] = [];
        categories[item.category].push(item);
      });

      let totalNodes = 0;
      for (const [catName, items] of Object.entries(categories)) {
        totalNodes += items.length;
        const catDiv = document.createElement('div');
        catDiv.className = 'tree-category';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'category-title';
        titleDiv.textContent = catName;
        catDiv.appendChild(titleDiv);

        items.forEach(item => {
          const node = document.createElement('div');
          node.className = `tree-node ${item.id === currentSelectedId ? 'active' : ''}`;
          node.onclick = () => selectDocument(item.id);

          let icon = '📄';
          if (catName.includes('第一层')) icon = '🏛️';
          else if (catName.includes('第二层') && catName.includes('API')) icon = '🔌';
          else if (catName.includes('第二层')) icon = '📚';
          else if (catName.includes('第三层')) icon = '📝';

          node.innerHTML = `
            <span class="node-icon">${icon}</span>
            <span class="node-title" title="${item.desc}">${item.title}</span>
          `;
          catDiv.appendChild(node);
        });

        container.appendChild(catDiv);
      }

      document.getElementById('node-count').textContent = `${totalNodes} 篇文档`;
    }

    function selectDocument(docId) {
      currentSelectedId = docId;
      const doc = memoryData.find(d => d.id === docId);
      if (!doc) return;

      document.getElementById('current-doc-path').textContent = doc.path;
      document.getElementById('current-doc-meta').textContent = doc.desc;
      document.getElementById('article-view').innerHTML = renderMarkdown(doc.content);

      renderTree(document.getElementById('filter-input').value);
    }

    function handleFilter(val) {
      renderTree(val);
    }

    // 轻量原生 Markdown 渲染器（支持标题、列表、四段式高亮、表格、引用）
    function renderMarkdown(md) {
      if (!md) return '';
      let html = md
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // 标题
      html = html.replace(/^#### (一、问题\/需求.*)$/gm, '<h4 style="color:#60a5fa;"><span class="four-section-badge badge-q">Q</span>$1</h4>');
      html = html.replace(/^#### (二、原因分析.*)$/gm, '<h4 style="color:#fbbf24;"><span class="four-section-badge badge-r">R</span>$1</h4>');
      html = html.replace(/^#### (三、测试结果.*)$/gm, '<h4 style="color:#34d399;"><span class="four-section-badge badge-t">T</span>$1</h4>');
      html = html.replace(/^#### (四、备注.*)$/gm, '<h4 style="color:#c084fc;"><span class="four-section-badge badge-n">N</span>$1</h4>');
      html = html.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
      html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');

      // 分割线
      html = html.replace(/^---$/gm, '<hr>');

      // 粗体
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      // 代码块与行内代码
      html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // 无序列表
      html = html.replace(/^\s*-\s+(.*)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

      // 链接
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:#38bdf8;text-decoration:none;">$1</a>');

      // 段落
      html = html.split('\n\n').map(p => {
        p = p.trim();
        if (p.startsWith('<h') || p.startsWith('<hr') || p.startsWith('<ul') || p.startsWith('<pre') || p.startsWith('<li')) {
          return p;
        }
        return `<p>${p.replace(/\n/g, '<br>')}</p>`;
      }).join('');

      return html;
    }

    // 初始化渲染
    selectDocument(currentSelectedId);
  </script>
