<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">诊断 debug 概念图</title>
  <desc id="desc">诊断技能以外部环境、数据、调用链和历史意图为证据，循环验证假设。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/></marker>
    <style>
      .bg{fill:#0b0b0b}.title{fill:#fff;font:700 42px "Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#9e9e9e;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.node{fill:#161616;stroke:#707070;stroke-width:2}.node-strong{fill:#202020;stroke:#fff;stroke-width:2}.node-title{fill:#fff;font:700 25px "Segoe UI","Microsoft YaHei",sans-serif}.node-body{fill:#c8c8c8;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.line{fill:none;stroke:#888;stroke-width:3;marker-end:url(#arrow)}.label{fill:#a9a9a9;font:600 18px "Segoe UI","Microsoft YaHei",sans-serif}.note{fill:#777;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="100" y="88">诊断 · debug</text>
  <text class="subtitle" x="100" y="124">只读取证：每轮只验证一个假设，不把推断当事实</text>
  <rect class="node-strong" x="660" y="170" width="280" height="100" rx="10"/>
  <text class="node-title" x="800" y="212" text-anchor="middle">现象 / 偏差</text>
  <text class="node-body" x="800" y="246" text-anchor="middle">场景、入口、数据</text>
  <path class="line" d="M800 270 V315"/>
  <rect class="node" x="570" y="315" width="460" height="85" rx="10"/>
  <text class="node-title" x="800" y="368" text-anchor="middle">外部环境 → 真实数据 → 调用链与代码</text>
  <path class="line" d="M800 400 V445"/>
  <rect class="node" x="570" y="445" width="460" height="85" rx="10"/>
  <text class="node-title" x="800" y="498" text-anchor="middle">Git / change / 替代路径 / 历史意图</text>
  <path class="line" d="M800 530 V575"/>
  <rect class="node-strong" x="570" y="575" width="460" height="100" rx="10"/>
  <text class="node-title" x="800" y="617" text-anchor="middle">假设 → 证据 → 结论</text>
  <text class="node-body" x="800" y="651" text-anchor="middle">确认 / 推翻 / 标记未知</text>
  <path class="line" d="M800 675 V720"/>
  <rect class="node" x="570" y="720" width="460" height="85" rx="10"/>
  <text class="node-title" x="800" y="773" text-anchor="middle">根因或未知项 → 最小修复计划</text>
  <path class="line" d="M570 758 H390 V487 H570"/>
  <text class="label" x="300" y="475">新疑点：回到证据循环</text>
  <text class="note" x="1120" y="360">不编辑代码、配置或正式记忆</text>
  <text class="note" x="1120" y="395">结论需与用户逐项确认</text>
</svg>
