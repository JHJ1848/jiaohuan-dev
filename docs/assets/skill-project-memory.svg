<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">项目记忆 project-memory 概念图</title>
  <desc id="desc">项目记忆技能负责记忆读取、收尾审查的历史证据和确认后的归档。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/></marker>
    <style>
      .bg{fill:#0b0b0b}.title{fill:#fff;font:700 42px "Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#9e9e9e;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.node{fill:#161616;stroke:#707070;stroke-width:2}.node-strong{fill:#202020;stroke:#fff;stroke-width:2}.node-title{fill:#fff;font:700 25px "Segoe UI","Microsoft YaHei",sans-serif}.node-body{fill:#c8c8c8;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.line{fill:none;stroke:#888;stroke-width:3;marker-end:url(#arrow)}.label{fill:#a9a9a9;font:600 18px "Segoe UI","Microsoft YaHei",sans-serif}.note{fill:#777;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="100" y="88">项目记忆 · project-memory</text>
  <text class="subtitle" x="100" y="124">语义路由与边界契约：不接管调度，也不制造平行索引</text>
  <rect class="node-strong" x="630" y="170" width="340" height="100" rx="10"/>
  <text class="node-title" x="800" y="212" text-anchor="middle">项目记忆路由</text>
  <text class="node-body" x="800" y="246" text-anchor="middle">开始前 · 任务中 · 完成后</text>
  <path class="line" d="M800 270 V330 H320 V395"/>
  <path class="line" d="M800 270 V330 H800 V395"/>
  <path class="line" d="M800 270 V330 H1280 V395"/>
  <text class="label" x="270" y="318">开始前回忆</text>
  <text class="label" x="735" y="318">主任务 / 独立子会话</text>
  <text class="label" x="1235" y="318">完成后的归档</text>
  <rect class="node" x="140" y="395" width="360" height="170" rx="10"/>
  <text class="node-title" x="320" y="440" text-anchor="middle">memory-get</text>
  <text class="node-body" x="320" y="480" text-anchor="middle">规则 · 主记忆 · 相关文档</text>
  <text class="node-body" x="320" y="515" text-anchor="middle">输出最小上下文</text>
  <rect class="node" x="620" y="395" width="360" height="170" rx="10"/>
  <text class="node-title" x="800" y="440" text-anchor="middle">memory-get → dev/debug</text>
  <text class="node-body" x="800" y="480" text-anchor="middle">实施变更先交 code-review</text>
  <text class="node-body" x="800" y="515" text-anchor="middle">主任务独占正式归档</text>
  <rect class="node" x="1100" y="395" width="360" height="170" rx="10"/>
  <text class="node-title" x="1280" y="440" text-anchor="middle">memory-put</text>
  <text class="node-body" x="1280" y="480" text-anchor="middle">用户确认后写入 docs/</text>
  <text class="node-body" x="1280" y="515" text-anchor="middle">保留关联、边界与状态</text>
  <path class="line" d="M500 480 H620"/>
  <path class="line" d="M980 480 H1100"/>
  <text class="note" x="100" y="700">禁止：任务调度 · 租约 · 跨 Agent 状态机 · 知识图谱 · 独立节点/边表</text>
  <text class="note" x="100" y="745">正式记录只在目标项目 docs/；冲突时停止并请求用户选择。</text>
</svg>
