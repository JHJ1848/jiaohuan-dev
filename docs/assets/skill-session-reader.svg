<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">会话读取 session-reader 概念图</title>
  <desc id="desc">会话读取技能从用户指定来源筛选可见消息，生成带来源指纹和省略边界的会话包并交给提炼流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/></marker>
    <style>
      .bg{fill:#0b0b0b}.title{fill:#fff;font:700 42px "Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#9e9e9e;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.node{fill:#161616;stroke:#707070;stroke-width:2}.node-strong{fill:#202020;stroke:#fff;stroke-width:2}.node-title{fill:#fff;font:700 21px "Segoe UI","Microsoft YaHei",sans-serif}.node-body{fill:#c8c8c8;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}.line{fill:none;stroke:#888;stroke-width:3;marker-end:url(#arrow)}.note{fill:#777;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="100" y="88">会话读取 · session-reader</text>
  <text class="subtitle" x="100" y="124">只读归一化：不复制原始会话，不直接写正式记忆</text>
  <rect class="node" x="90" y="370" width="260" height="135" rx="10"/>
  <text class="node-title" x="220" y="418" text-anchor="middle">用户指定来源</text>
  <text class="node-body" x="220" y="450" text-anchor="middle">Codex / Claude / Gemini</text>
  <text class="node-body" x="220" y="478" text-anchor="middle">/ 导出文件</text>
  <path class="line" d="M350 437 H400"/>
  <rect class="node" x="400" y="370" width="260" height="135" rx="10"/>
  <text class="node-title" x="530" y="418" text-anchor="middle">范围选择</text>
  <text class="node-body" x="530" y="458" text-anchor="middle">query · from · to</text>
  <path class="line" d="M660 437 H710"/>
  <rect class="node-strong" x="710" y="370" width="260" height="135" rx="10"/>
  <text class="node-title" x="840" y="418" text-anchor="middle">会话包</text>
  <text class="node-body" x="840" y="458" text-anchor="middle">user / assistant · 来源指纹</text>
  <path class="line" d="M970 437 H1020"/>
  <rect class="node" x="1020" y="370" width="260" height="135" rx="10"/>
  <text class="node-title" x="1150" y="418" text-anchor="middle">会话提炼</text>
  <text class="node-body" x="1150" y="458" text-anchor="middle">session-gotcha-extractor</text>
  <path class="line" d="M1280 437 H1330"/>
  <rect class="node" x="1330" y="370" width="210" height="135" rx="10"/>
  <text class="node-title" x="1435" y="418" text-anchor="middle">memory-put</text>
  <text class="node-body" x="1435" y="458" text-anchor="middle">确认后归档</text>
  <text class="note" x="100" y="650">省略：system · developer · tool · 隐藏推理。未知格式、来源不完整时报告边界。</text>
  <text class="note" x="100" y="700">仅按指定文件或会话 ID 定位；不全盘扫描，不保存原始快照。</text>
  <text class="note" x="100" y="820">会话包是提炼输入，不是项目记忆；正式记录只经 memory-put 写入 docs/。</text>
</svg>
