<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">开发 dev 概念图</title>
  <desc id="desc">开发技能从确认计划到最小改动、影响复核和记忆交接。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/></marker>
    <style>
      .bg{fill:#0b0b0b}.title{fill:#fff;font:700 42px "Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#9e9e9e;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.node{fill:#161616;stroke:#707070;stroke-width:2}.node-strong{fill:#202020;stroke:#fff;stroke-width:2}.node-title{fill:#fff;font:700 25px "Segoe UI","Microsoft YaHei",sans-serif}.node-body{fill:#c8c8c8;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.line{fill:none;stroke:#888;stroke-width:3;marker-end:url(#arrow)}.label{fill:#a9a9a9;font:600 18px "Segoe UI","Microsoft YaHei",sans-serif}.note{fill:#777;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="100" y="88">开发 · dev</text>
  <text class="subtitle" x="100" y="124">计划已确认后，只实施最小、可逆且可交接的改动</text>
  <rect class="node-strong" x="90" y="350" width="260" height="150" rx="10"/>
  <text class="node-title" x="220" y="405" text-anchor="middle">确认计划</text>
  <text class="node-body" x="220" y="445" text-anchor="middle">范围 · 验收 · 约束</text>
  <path class="line" d="M350 425 H470"/>
  <rect class="node" x="470" y="350" width="260" height="150" rx="10"/>
  <text class="node-title" x="600" y="405" text-anchor="middle">最小改动</text>
  <text class="node-body" x="600" y="445" text-anchor="middle">不加猜测性兜底</text>
  <path class="line" d="M730 425 H850"/>
  <rect class="node" x="850" y="350" width="260" height="150" rx="10"/>
  <text class="node-title" x="980" y="405" text-anchor="middle">保持不变量</text>
  <text class="node-body" x="980" y="445" text-anchor="middle">时序 · 数据 · 影响面</text>
  <path class="line" d="M1110 425 H1230"/>
  <rect class="node" x="1230" y="350" width="260" height="150" rx="10"/>
  <text class="node-title" x="1360" y="405" text-anchor="middle">code-review</text>
  <text class="node-body" x="1360" y="445" text-anchor="middle">规格 · 规范 · 历史坑点</text>
  <path class="line" d="M980 500 V650 H760"/>
  <rect class="node" x="500" y="650" width="260" height="110" rx="10"/>
  <text class="node-title" x="630" y="695" text-anchor="middle">出现疑点</text>
  <text class="node-body" x="630" y="730" text-anchor="middle">回交 debug 取证</text>
  <text class="label" x="1010" y="600">疑点 / 计划外差异</text>
  <text class="note" x="100" y="830">审查通过后再交 memory-put；疑点回交 debug。</text>
</svg>
