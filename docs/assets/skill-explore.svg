<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">探索 explore 概念图</title>
  <desc id="desc">探索技能在目标或范围不清时读取最小上下文，只读梳理事实、历史意图和未知项，再决定下一条工作流。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/></marker>
    <style>
      .bg{fill:#0b0b0b}.title{fill:#fff;font:700 42px "Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#9e9e9e;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.node{fill:#161616;stroke:#707070;stroke-width:2}.node-strong{fill:#202020;stroke:#fff;stroke-width:2}.node-title{fill:#fff;font:700 24px "Segoe UI","Microsoft YaHei",sans-serif}.node-body{fill:#c8c8c8;font:400 19px "Segoe UI","Microsoft YaHei",sans-serif}.line{fill:none;stroke:#888;stroke-width:3;marker-end:url(#arrow)}.note{fill:#777;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="100" y="88">探索 · explore</text>
  <text class="subtitle" x="100" y="124">目标或范围不清时，只读取得足以决定下一步的最小事实</text>
  <rect class="node" x="100" y="370" width="300" height="135" rx="10"/>
  <text class="node-title" x="250" y="418" text-anchor="middle">memory-get</text>
  <text class="node-body" x="250" y="458" text-anchor="middle">规则 · 记忆 · 索引</text>
  <path class="line" d="M400 437 H500"/>
  <rect class="node" x="500" y="370" width="300" height="135" rx="10"/>
  <text class="node-title" x="650" y="418" text-anchor="middle">现状梳理</text>
  <text class="node-body" x="650" y="458" text-anchor="middle">入口 · 调用链 · 影响范围</text>
  <path class="line" d="M800 437 H900"/>
  <rect class="node" x="900" y="370" width="300" height="135" rx="10"/>
  <text class="node-title" x="1050" y="418" text-anchor="middle">历史与未知</text>
  <text class="node-body" x="1050" y="458" text-anchor="middle">Git · change · 待确认项</text>
  <path class="line" d="M1200 437 H1300"/>
  <rect class="node-strong" x="1300" y="370" width="260" height="135" rx="10"/>
  <text class="node-title" x="1430" y="418" text-anchor="middle">下一关</text>
  <text class="node-body" x="1430" y="458" text-anchor="middle">debug / dev / 停止</text>
  <text class="note" x="100" y="650">输出：路由、依据、已知事实、未知项、边界和下一关；不把探索静默升级为修改。</text>
  <text class="note" x="100" y="700">需要实施时先交用户确认，再进入 dev；根因未明时转 debug。</text>
  <text class="note" x="100" y="820">边界：不改代码、配置或正式记忆，不维护持久状态机。</text>
</svg>
