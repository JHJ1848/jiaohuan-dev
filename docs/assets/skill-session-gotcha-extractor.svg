<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">会话陷阱提炼 session-gotcha-extractor 概念图</title>
  <desc id="desc">从用户指定会话的标准化可见消息提炼工程场景和证据，生成候选临时草稿并交给 memory-put。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/></marker>
    <style>
      .bg{fill:#0b0b0b}.title{fill:#fff;font:700 42px "Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#9e9e9e;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.node{fill:#161616;stroke:#707070;stroke-width:2}.node-strong{fill:#202020;stroke:#fff;stroke-width:2}.node-title{fill:#fff;font:700 22px "Segoe UI","Microsoft YaHei",sans-serif}.node-body{fill:#c8c8c8;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}.line{fill:none;stroke:#888;stroke-width:3;marker-end:url(#arrow)}.note{fill:#777;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="100" y="88">会话陷阱提炼 · session-gotcha-extractor</text>
  <text class="subtitle" x="100" y="124">只处理工程会话：先读取、再提炼，正式归档仍由主任务确认</text>
  <rect class="node" x="60" y="370" width="260" height="135" rx="10"/>
  <text class="node-title" x="190" y="418" text-anchor="middle">指定会话来源</text>
  <text class="node-body" x="190" y="458" text-anchor="middle">厂商会话 / 导出文件</text>
  <path class="line" d="M320 437 H370"/>
  <rect class="node-strong" x="370" y="370" width="260" height="135" rx="10"/>
  <text class="node-title" x="500" y="418" text-anchor="middle">session-reader</text>
  <text class="node-body" x="500" y="458" text-anchor="middle">可见 user / assistant</text>
  <path class="line" d="M630 437 H680"/>
  <rect class="node" x="680" y="370" width="260" height="135" rx="10"/>
  <text class="node-title" x="810" y="418" text-anchor="middle">工程会话提炼</text>
  <text class="node-body" x="810" y="458" text-anchor="middle">场景 · 误判 · 证据</text>
  <path class="line" d="M940 437 H990"/>
  <rect class="node" x="990" y="370" width="260" height="135" rx="10"/>
  <text class="node-title" x="1120" y="418" text-anchor="middle">候选临时草稿</text>
  <text class="node-body" x="1120" y="458" text-anchor="middle">边界 · 未知项 · 结论</text>
  <path class="line" d="M1250 437 H1300"/>
  <rect class="node-strong" x="1300" y="370" width="240" height="135" rx="10"/>
  <text class="node-title" x="1420" y="418" text-anchor="middle">memory-put</text>
  <text class="node-body" x="1420" y="458" text-anchor="middle">确认后归档</text>
  <text class="note" x="100" y="650">省略：system · developer · tool · 隐藏推理；读取器只报告省略边界，不保存原始快照。</text>
  <text class="note" x="100" y="700">非工程会话：简述并停止。未根治的问题：交给 debug。</text>
  <text class="note" x="100" y="820">禁止：直接修改正式 MEMORY.md，或创建平行 Gotcha 索引。</text>
</svg>
