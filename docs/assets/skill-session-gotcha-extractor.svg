<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">会话陷阱提炼 session-gotcha-extractor 概念图</title>
  <desc id="desc">从历史工程会话提炼场景、误判、证据、边界和未知项，交给 memory-put。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/></marker>
    <style>
      .bg{fill:#0b0b0b}.title{fill:#fff;font:700 42px "Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#9e9e9e;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.node{fill:#161616;stroke:#707070;stroke-width:2}.node-strong{fill:#202020;stroke:#fff;stroke-width:2}.node-title{fill:#fff;font:700 25px "Segoe UI","Microsoft YaHei",sans-serif}.node-body{fill:#c8c8c8;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.line{fill:none;stroke:#888;stroke-width:3;marker-end:url(#arrow)}.label{fill:#a9a9a9;font:600 18px "Segoe UI","Microsoft YaHei",sans-serif}.note{fill:#777;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="100" y="88">会话陷阱提炼 · session-gotcha-extractor</text>
  <text class="subtitle" x="100" y="124">只处理工程会话，把可复用证据交给正式归档流程</text>
  <rect class="node-strong" x="90" y="370" width="270" height="135" rx="10"/>
  <text class="node-title" x="225" y="418" text-anchor="middle">历史工程会话</text>
  <text class="node-body" x="225" y="458" text-anchor="middle">开发 / 诊断上下文</text>
  <path class="line" d="M360 437 H480"/>
  <rect class="node" x="480" y="370" width="270" height="135" rx="10"/>
  <text class="node-title" x="615" y="418" text-anchor="middle">场景与症状</text>
  <text class="node-body" x="615" y="458" text-anchor="middle">入口 · 偏差 · 影响</text>
  <path class="line" d="M750 437 H870"/>
  <rect class="node" x="870" y="370" width="270" height="135" rx="10"/>
  <text class="node-title" x="1005" y="418" text-anchor="middle">误判与证据</text>
  <text class="node-body" x="1005" y="458" text-anchor="middle">已证实 / 被否定</text>
  <path class="line" d="M1140 437 H1260"/>
  <rect class="node" x="1260" y="370" width="270" height="135" rx="10"/>
  <text class="node-title" x="1395" y="418" text-anchor="middle">修复边界与未知</text>
  <text class="node-body" x="1395" y="458" text-anchor="middle">不扩大为新事实</text>
  <path class="line" d="M1395 505 V635 H1000"/>
  <rect class="node-strong" x="700" y="635" width="300" height="110" rx="10"/>
  <text class="node-title" x="850" y="680" text-anchor="middle">memory-put 证据</text>
  <text class="node-body" x="850" y="716" text-anchor="middle">等待主任务确认归档</text>
  <path class="line" d="M700 690 H520 V555"/>
  <text class="label" x="170" y="570">非工程会话</text>
  <text class="label" x="170" y="603">简述并停止</text>
  <text class="note" x="100" y="820">禁止：直接修改正式 MEMORY.md，或创建平行 Gotcha 索引。</text>
</svg>
