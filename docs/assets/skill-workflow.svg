<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">工作流 workflow 概念图</title>
  <desc id="desc">按任务类型选择 memory-get、dev、debug 与 memory-put 的路由图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/></marker>
    <style>
      .bg{fill:#0b0b0b}.title{fill:#fff;font:700 42px "Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#9e9e9e;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.node{fill:#161616;stroke:#707070;stroke-width:2}.node-strong{fill:#202020;stroke:#fff;stroke-width:2}.node-title{fill:#fff;font:700 25px "Segoe UI","Microsoft YaHei",sans-serif}.node-body{fill:#c8c8c8;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.line{fill:none;stroke:#888;stroke-width:3;marker-end:url(#arrow)}.label{fill:#a9a9a9;font:600 18px "Segoe UI","Microsoft YaHei",sans-serif}.note{fill:#777;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="100" y="88">工作流 · workflow</text>
  <text class="subtitle" x="100" y="124">轻量语义路由：先识别任务，再进入最小闭环</text>
  <rect class="node-strong" x="620" y="170" width="360" height="100" rx="10"/>
  <text class="node-title" x="800" y="212" text-anchor="middle">任务类型识别</text>
  <text class="node-body" x="800" y="246" text-anchor="middle">开发 · 诊断 · Bug 修复</text>
  <path class="line" d="M800 270 V330 H300 V390"/>
  <path class="line" d="M800 270 V330 H800 V390"/>
  <path class="line" d="M800 270 V330 H1300 V390"/>
  <text class="label" x="360" y="318">单一开发</text>
  <text class="label" x="735" y="318">仅诊断</text>
  <text class="label" x="1190" y="318">Bug 修复</text>
  <rect class="node" x="120" y="390" width="360" height="230" rx="10"/>
  <text class="node-title" x="300" y="438" text-anchor="middle">开发路径</text>
  <text class="node-body" x="300" y="485" text-anchor="middle">memory-get</text>
  <path class="line" d="M300 500 V535"/>
  <text class="node-body" x="300" y="570" text-anchor="middle">dev</text>
  <path class="line" d="M300 585 V620"/>
  <text class="node-body" x="300" y="655" text-anchor="middle">memory-put</text>
  <rect class="node" x="620" y="390" width="360" height="230" rx="10"/>
  <text class="node-title" x="800" y="438" text-anchor="middle">诊断路径</text>
  <text class="node-body" x="800" y="485" text-anchor="middle">memory-get</text>
  <path class="line" d="M800 500 V535"/>
  <text class="node-body" x="800" y="570" text-anchor="middle">debug</text>
  <path class="line" d="M800 585 V620"/>
  <text class="node-body" x="800" y="655" text-anchor="middle">memory-put</text>
  <rect class="node" x="1120" y="390" width="360" height="230" rx="10"/>
  <text class="node-title" x="1300" y="438" text-anchor="middle">修复路径</text>
  <text class="node-body" x="1300" y="485" text-anchor="middle">memory-get</text>
  <path class="line" d="M1300 500 V530"/>
  <text class="node-body" x="1300" y="565" text-anchor="middle">debug → dev</text>
  <path class="line" d="M1300 580 V620"/>
  <text class="node-body" x="1300" y="655" text-anchor="middle">memory-put</text>
  <text class="note" x="100" y="790">边界：只负责路由，不维护状态机、调度器、租约或重试循环。</text>
</svg>
