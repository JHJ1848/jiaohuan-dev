<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">工作流 workflow 概念图</title>
  <desc id="desc">按任务语义路由到开发、诊断、缺陷修复或探索，并在归档前经过最小闭环。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/></marker>
    <style>
      .bg{fill:#0b0b0b}.title{fill:#fff;font:700 42px "Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#9e9e9e;font:400 20px "Segoe UI","Microsoft YaHei",sans-serif}.node{fill:#161616;stroke:#707070;stroke-width:2}.node-strong{fill:#202020;stroke:#fff;stroke-width:2}.node-title{fill:#fff;font:700 24px "Segoe UI","Microsoft YaHei",sans-serif}.node-body{fill:#c8c8c8;font:400 19px "Segoe UI","Microsoft YaHei",sans-serif}.line{fill:none;stroke:#888;stroke-width:3;marker-end:url(#arrow)}.note{fill:#777;font:400 18px "Segoe UI","Microsoft YaHei",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="100" y="88">工作流 · workflow</text>
  <text class="subtitle" x="100" y="124">轻量语义路由：先识别任务，再进入最小闭环</text>
  <rect class="node-strong" x="610" y="170" width="380" height="100" rx="10"/>
  <text class="node-title" x="800" y="212" text-anchor="middle">任务类型识别</text>
  <text class="node-body" x="800" y="246" text-anchor="middle">开发 · 诊断 · Bug 修复 · 探索</text>
  <path class="line" d="M650 270 V310 H240 V390"/>
  <path class="line" d="M750 270 V330 H600 V390"/>
  <path class="line" d="M850 270 V350 H960 V390"/>
  <path class="line" d="M990 270 V370 H1320 V390"/>
  <rect class="node" x="80" y="390" width="320" height="230" rx="10"/>
  <text class="node-title" x="240" y="438" text-anchor="middle">开发路径</text>
  <text class="node-body" x="240" y="486" text-anchor="middle">memory-get → dev</text>
  <text class="node-body" x="240" y="532" text-anchor="middle">code-review → memory-put</text>
  <text class="node-body" x="240" y="578" text-anchor="middle">仅文档时可省略审查</text>
  <rect class="node" x="440" y="390" width="320" height="230" rx="10"/>
  <text class="node-title" x="600" y="438" text-anchor="middle">诊断路径</text>
  <text class="node-body" x="600" y="486" text-anchor="middle">memory-get → debug</text>
  <text class="node-body" x="600" y="532" text-anchor="middle">根因或未知项</text>
  <text class="node-body" x="600" y="578" text-anchor="middle">→ memory-put</text>
  <rect class="node" x="800" y="390" width="320" height="230" rx="10"/>
  <text class="node-title" x="960" y="438" text-anchor="middle">修复路径</text>
  <text class="node-body" x="960" y="486" text-anchor="middle">memory-get → debug → dev</text>
  <text class="node-body" x="960" y="532" text-anchor="middle">code-review → memory-put</text>
  <text class="node-body" x="960" y="578" text-anchor="middle">计划确认后才修改</text>
  <rect class="node" x="1160" y="390" width="320" height="230" rx="10"/>
  <text class="node-title" x="1320" y="438" text-anchor="middle">探索路径</text>
  <text class="node-body" x="1320" y="486" text-anchor="middle">memory-get → explore</text>
  <text class="node-body" x="1320" y="532" text-anchor="middle">明确后转 debug / dev</text>
  <text class="node-body" x="1320" y="578" text-anchor="middle">或停止 → memory-put</text>
  <text class="note" x="100" y="740">会话提炼辅助链：session-reader → session-gotcha-extractor → memory-put（不自动归档）。</text>
  <text class="note" x="100" y="790">边界：只负责路由，不维护状态机、调度器、租约或重试循环。</text>
</svg>
